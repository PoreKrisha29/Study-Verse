services:
  - type: web
    name: studyverse
    env: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # eventlet worker is REQUIRED to match async_mode='eventlet' in Flask-SocketIO
    startCommand: gunicorn --config gunicorn.conf.py --worker-class eventlet -w 1 --timeout 180 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: WEB_CONCURRENCY
        value: 1




